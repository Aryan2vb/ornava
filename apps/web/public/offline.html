<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ornava offline</title>
    <meta name="theme-color" content="#1A1A1A" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f5f5dc;
        color: #1a1a1a;
      }

      main {
        width: min(100% - 40px, 360px);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 30px;
      }

      p {
        margin: 0;
        color: #676052;
        font-size: 14px;
        line-height: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/ornava.svg" alt="" />
      <h1>You're offline</h1>
      <p>Reconnect to open Ornava and continue generating catalog images.</p>
    </main>
  </body>
</html>
