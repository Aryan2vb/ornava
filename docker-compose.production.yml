services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ornava-web
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "3002:3000"
    depends_on:
      worker:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ornava-worker
    restart: unless-stopped
    env_file: .env.production

  nginx:
    image: nginx:alpine
    container_name: ornava-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: ornava-certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
