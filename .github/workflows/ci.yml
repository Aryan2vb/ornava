name: CI

# Deploys are handled by Render, which builds the root Dockerfile on push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ornava/shared exec tsc --build --force
      - run: pnpm --filter @ornava/web exec tsc --noEmit
      - run: pnpm --filter @ornava/worker exec tsc --noEmit
      - run: pnpm --filter @ornava/web test
      - run: pnpm --filter @ornava/worker test
