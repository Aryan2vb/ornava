services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    container_name: ornava-web
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "3002:3000"
    depends_on:
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started

  # Two worker replicas. Each runs concurrency=10 → total 20 parallel slots.
  # Using explicit services (not deploy.replicas) for consistency across
  # docker compose v2 and older tooling.
  worker-1:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ornava-worker-1
    restart: unless-stopped
    env_file: .env.production

  worker-2:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ornava-worker-2
    restart: unless-stopped
    env_file: .env.production

  redis:
    image: redis:7-alpine
    container_name: ornava-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: ornava-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: ornava-certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

volumes:
  redis-data: